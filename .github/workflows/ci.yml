# Regression gate for the internal-clock hot path.
#
# Builds Release with -O3 -march=native (docs/architecture.md §7), runs the
# full ctest suite, then executes the latency harness. The JSON benchmark
# output and the rendered docs/latency_report.md are uploaded as artifacts so
# future runs can be diffed against them for a p99 regression check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-bench:
    name: Build, test, benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Ninja, CMake, GCC C++20)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            cmake \
            g++ \
            python3
          cmake --version
          ninja --version
          g++ --version

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOEP_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build

      - name: Test (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: Run latency benchmarks
        run: scripts/run_benchmarks.sh

      # p99 regression gate: compares the fresh JSON in benchmarks/ against
      # the committed reference in benchmarks/ci_baseline/. The committed
      # baseline was captured on a pinned dev box, so on GitHub's shared
      # runners the gate runs in advisory mode (host_name mismatch reports
      # but never fails). To arm it strictly: download the benchmark-json
      # artifact from a trusted run on this runner class, commit those files
      # to benchmarks/ci_baseline/, and drop --advisory-on-host-mismatch.
      # The fused (LibTorch) benchmark is gated only on torch-enabled local
      # boxes — CI builds without OEP_USE_TORCH, so it is absent here.
      - name: Latency p99 regression gate
        run: |
          for b in order_book_bench spsc_ring_bench slab_allocator_bench; do
            python3 scripts/check_latency_regression.py \
              "benchmarks/ci_baseline/${b}.json" \
              "benchmarks/${b}.json" \
              --tol-pct 0.15 --tol-abs-ns 15 \
              --advisory-on-host-mismatch
          done

      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: docs/latency_report.md

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: benchmarks/*.json
